# Copy this file to .github/workflows/dsh-commands.yml. The action and
# validation image are pinned to the v0.2.0 audited release inputs.
name: DSH commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  checks: read
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: dsh-command-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  command:
    if: contains(github.event.comment.body || github.event.review.body || '', '@dsh')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # issue_comment workflows run from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: Lixiaoyiao/deepseek-harness-action@50580590de152abcc3bd81c07b26dd632b76360b
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          allow-write: "true"
          run-tests: "true"
          test-commands: '[["npm","ci","--ignore-scripts"],["npm","test"],["npm","run","typecheck"]]'
          container-image: docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
