name: DSH review

on:
  # GitHub loads pull_request_target workflows from the trusted base repository.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dsh-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Use the immutable commit that supplied this trusted target
          # workflow. A PR may target another branch, so base.sha is not a
          # sufficient action-code trust boundary.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      # action.yml, dist and policy assets now come from github.workflow_sha.
      - uses: ./
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          allow-write: "false"
