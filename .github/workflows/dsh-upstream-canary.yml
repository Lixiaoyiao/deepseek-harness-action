name: DSH upstream compatibility canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: dsh-upstream-compatibility-canary
  cancel-in-progress: true

jobs:
  native-compatibility:
    name: Next DSH candidate native compatibility warning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select the next published DSH candidate
        id: candidate
        shell: bash
        env:
          AUDITED_DSH_VERSION: 0.1.1-rc.2
        run: |
          set -euo pipefail
          versions="$(npm view "@deepseek-ai/dsh" versions --json)"
          candidate="$(AUDITED_DSH_VERSION="$AUDITED_DSH_VERSION" CANDIDATE_VERSIONS="$versions" node --input-type=module <<'NODE'
          const decoded = JSON.parse(process.env.CANDIDATE_VERSIONS ?? "[]");
          const versions = Array.isArray(decoded) ? decoded : [decoded];
          const current = versions.indexOf(process.env.AUDITED_DSH_VERSION);
          if (current < 0) {
            throw new Error("The audited DSH version is absent from the published version inventory");
          }
          const next = versions[current + 1];
          process.stdout.write(typeof next === "string" ? next : "");
          NODE
          )"
          echo "version=$candidate" >> "$GITHUB_OUTPUT"
          if [[ -z "$candidate" ]]; then
            echo "No DSH version newer than $AUDITED_DSH_VERSION is currently published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Testing candidate $candidate for maintenance warning only; this does not declare Action support." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install candidate without changing the production manifest or lockfile
        if: steps.candidate.outputs.version != ''
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          const dependencies = { ...manifest.dependencies, ...manifest.devDependencies };
          for (const name of Object.keys(dependencies).sort()) {
            if (name === "@deepseek-ai/dsh" || name.startsWith("@deepseek-ai/dsh-")) {
              process.stdout.write(`${name}\n`);
            }
          }
          NODE
          )
          specs=()
          for package in "${packages[@]}"; do
            specs+=("$package@$CANDIDATE_VERSION")
          done
          npm install --no-audit --no-fund --ignore-scripts --no-save --package-lock=false "${specs[@]}"
      - name: Native composition and ecosystem compatibility smoke
        if: steps.candidate.outputs.version != ''
        run: >-
          npm exec -- vitest run
          test/dsh-composition.test.ts
          test/native-ecosystem.integration.test.ts
      - name: Verify the canary did not change production pins
        if: always()
        run: git diff --exit-code -- package.json package-lock.json src/release.ts action.yml
      - name: Report advisory incompatibility
        if: failure()
        run: |
          echo "::warning::The next DSH candidate failed the advisory compatibility smoke. Production remains pinned and supported only at 0.1.1-rc.2."
          echo "The upstream candidate is not yet compatible; no production support or pin changed." >> "$GITHUB_STEP_SUMMARY"
