name: DSH upstream compatibility canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: dsh-upstream-compatibility-canary
  cancel-in-progress: true

jobs:
  native-compatibility:
    name: Latest official ${{ matrix.channel }} DSH compatibility warning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, rc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve, install, and test an isolated official candidate
        env:
          CANDIDATE_CHANNEL: ${{ matrix.channel }}
        run: node scripts/upstream-canary.mjs run "$CANDIDATE_CHANNEL"
      - name: Verify the canary did not change production pins
        if: always()
        run: git diff --exit-code -- package.json package-lock.json src/release.ts action.yml
      - name: Report candidate status even after an interrupted attempt
        if: always()
        env:
          CANDIDATE_CHANNEL: ${{ matrix.channel }}
        run: node scripts/upstream-canary.mjs report "$CANDIDATE_CHANNEL"
      - name: Preserve candidate dependency and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-canary-${{ matrix.channel }}
          path: ${{ runner.temp }}/dsh-upstream-${{ matrix.channel }}/evidence/
          if-no-files-found: error
          retention-days: 14
