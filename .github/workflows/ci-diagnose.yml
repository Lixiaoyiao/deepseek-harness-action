name: DSH CI diagnosis

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dsh-ci-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run executes trusted default-branch code, never the failed revision.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          allow-write: "false"
