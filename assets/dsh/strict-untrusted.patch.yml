# DSH 0.1.0-rc.6 stock-headless composition overlay.
# Untrusted jobs receive a controller-built context packet and no model tools.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
    defaultPreset: read-only

- id: session-title-llm
  disabled: true

